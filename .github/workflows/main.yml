name: Cypress Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Cancel an in-flight run when a newer commit is pushed, so the latest
# report deploys without waiting behind stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    env:
      # Runners are UTC by default; pin to Nepal time so report timestamps
      # match local time.
      TZ: Asia/Kathmandu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Clean stale Allure results
        run: rm -rf allure-results

      - name: Run Cypress tests
        run: npx cypress run --browser chrome
        continue-on-error: true
        env:
          CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 5

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  publish-report:
    runs-on: ubuntu-latest
    needs: cypress-run
    if: always()
    env:
      TZ: Asia/Kathmandu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history from gh-pages
        run: |
          if git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
            echo "gh-pages branch found, extracting history..."
            git fetch origin gh-pages --depth=1
            mkdir -p gh-pages
            git archive FETCH_HEAD | tar -x -C gh-pages/
            echo "History extracted:"
            ls gh-pages/last-history 2>/dev/null || echo "No last-history folder yet"
          else
            echo "gh-pages branch does not exist yet, starting fresh."
          fi

      - name: Add Allure executor metadata
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Cypress Allure Report",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 5

      # The Allure action runs in a Docker container as root, so files under
      # allure-history (e.g. last-history) are root-owned. Fix permissions
      # BEFORE the trim steps so the runner user can rewrite them.
      - name: Fix permissions on allure-history
        run: sudo chmod -R 777 allure-history && sudo rm -rf allure-history/.git

      - name: Keep only the last 5 run reports
        run: |
          cd allure-history
          # Numbered folders (1, 2, 3, ...) are individual run reports.
          # Keep the 5 most recent, delete the rest. The root index.html
          # always redirects to the latest run, which is preserved.
          OLD_REPORTS=$(ls -d */ 2>/dev/null | grep -E '^[0-9]+/$' | sed 's#/##' | sort -n | head -n -5)
          if [ -n "$OLD_REPORTS" ]; then
            echo "Removing old reports: $OLD_REPORTS"
            for d in $OLD_REPORTS; do rm -rf "$d"; done
          else
            echo "5 or fewer reports present, nothing to trim."
          fi

      - name: Limit trend chart to last 5 runs
        run: |
          # The trend widgets (history/duration/retry/categories-trend.json)
          # accumulate one entry per run forever. They are ordered newest-first,
          # so [0:5] keeps the 5 most recent. Trimming last-history too caps the
          # data carried into the next run.
          find allure-history -name '*-trend.json' | while read -r f; do
            tmp=$(mktemp)
            jq '.[0:5]' "$f" > "$tmp" && mv "$tmp" "$f"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          # Keep gh-pages as a single commit so the branch stays small and
          # pushes / Pages builds stay fast as runs accumulate.
          force_orphan: true
